[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

; Loopback-only, same as backend/supervisord.conf's postgres program --
; nothing outside this container ever connects to it directly.
[program:postgres]
command=/usr/lib/postgresql/16/bin/postgres -D %(ENV_PGDATA)s
user=postgres
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/postgres.log
stderr_logfile=/var/log/supervisor/postgres_err.log

; No auth, loopback-only -- matches docker-compose.yml's redis service
; (reached over the Docker network by service name there; reached over
; localhost here since it's a sibling process in the same container
; instead of a separate one). Disposable data only (pub/sub, rate-limit
; counters, the mock tick stream), so no persistence flags needed.
[program:redis]
command=redis-server --bind 127.0.0.1 --port 6379 --daemonize no --dir /var/lib/redis --appendonly no
user=redis
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/redis.log
stderr_logfile=/var/log/supervisor/redis_err.log

; backend/scripts/api-entrypoint.sh's own Postgres-readiness wait + Alembic
; migrate + uvicorn start, reused as-is -- UVICORN_HOST=127.0.0.1 (see that
; script) keeps it reachable only via the nginx program below, not directly.
[program:api]
command=/app/scripts/api-entrypoint.sh
directory=/app
user=root
autorestart=true
priority=20
startsecs=5
environment=UVICORN_HOST="127.0.0.1"
stdout_logfile=/var/log/supervisor/api.log
stderr_logfile=/var/log/supervisor/api_err.log

; The Next.js standalone server (next.config.mjs: output: 'standalone').
; HOSTNAME=127.0.0.1 keeps it reachable only via nginx, same posture as api.
[program:frontend]
command=node server.js
directory=/app/frontend
user=root
autorestart=true
priority=20
startsecs=3
environment=PORT="3000",HOSTNAME="127.0.0.1",NODE_ENV="production"
stdout_logfile=/var/log/supervisor/frontend.log
stderr_logfile=/var/log/supervisor/frontend_err.log

; The only process actually reachable from outside this container --
; reverse-proxies /api/* and /health to the api program and everything
; else to the frontend program, on whatever $PORT the host platform
; injects (rendered into tradingos.conf by allinone-entrypoint.sh before
; this starts).
[program:nginx]
command=nginx -g 'daemon off;'
user=root
autorestart=true
priority=30
startsecs=3
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx_err.log
