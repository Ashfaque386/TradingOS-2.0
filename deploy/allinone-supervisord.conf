[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

; Loopback-only, same as backend/supervisord.conf's postgres program --
; nothing outside this container ever connects to it directly. Tuned well
; below Postgres's own defaults (shared_buffers=128MB, max_connections=100)
; -- this process shares one memory budget with Redis, the Python backend,
; the frontend's Node server, and nginx, all in the same container, which
; the defaults assume it doesn't. Measured necessary after a real deploy
; hit its platform's memory ceiling under normal use (login -> dashboard,
; which opens several WebSocket channels at once).
[program:postgres]
command=/usr/lib/postgresql/16/bin/postgres -D %(ENV_PGDATA)s -c shared_buffers=16MB -c max_connections=20 -c work_mem=2MB -c maintenance_work_mem=16MB -c wal_buffers=1MB
user=postgres
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/postgres.log
stderr_logfile=/var/log/supervisor/postgres_err.log

; No auth, loopback-only -- matches docker-compose.yml's redis service
; (reached over the Docker network by service name there; reached over
; localhost here since it's a sibling process in the same container
; instead of a separate one). Disposable data only (pub/sub, rate-limit
; counters, the mock tick stream), so no persistence flags needed --
; maxmemory caps worst-case growth instead of leaving it unbounded.
[program:redis]
command=redis-server --bind 127.0.0.1 --port 6379 --daemonize no --dir /var/lib/redis --appendonly no --maxmemory 24mb --maxmemory-policy allkeys-lru
user=redis
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/redis.log
stderr_logfile=/var/log/supervisor/redis_err.log

; backend/scripts/api-entrypoint.sh's own Postgres-readiness wait + Alembic
; migrate + uvicorn start, reused as-is -- UVICORN_HOST=127.0.0.1 (see that
; script) keeps it reachable only via the nginx program below, not directly.
; DB_POOL_SIZE/DB_MAX_OVERFLOW (src/core/config.py) override the 20/20
; default sized for backend/Dockerfile's own container (which has nothing
; else competing for memory) down to what a solo-operator single-container
; deployment actually needs -- each pooled connection is a real Postgres
; backend process with its own memory footprint, and this container's
; tuned-down max_connections=20 above can't support 20/20 (up to 40) again.
[program:api]
command=/app/scripts/api-entrypoint.sh
directory=/app
user=root
autorestart=true
priority=20
startsecs=5
environment=UVICORN_HOST="127.0.0.1",DB_POOL_SIZE="5",DB_MAX_OVERFLOW="5"
; Forwarded to the container's own stdout/stderr (not a file inside it)
; so `docker compose logs backend` shows every API request/error and the
; api-entrypoint.sh startup warnings -- a file here hid the
; SECRETS_ENCRYPTION_KEY warning entirely (Phase 17 Settings fix).
; maxbytes=0 is required: supervisord can't rotate a pipe.
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; The Next.js standalone server (next.config.mjs: output: 'standalone').
; HOSTNAME=127.0.0.1 keeps it reachable only via nginx, same posture as api.
; NODE_OPTIONS caps V8's heap so a traffic spike can't grow it unbounded in
; this same shared memory budget.
[program:frontend]
command=node server.js
directory=/app/frontend
user=root
autorestart=true
priority=20
startsecs=3
environment=PORT="3000",HOSTNAME="127.0.0.1",NODE_ENV="production",NODE_OPTIONS="--max-old-space-size=128"
stdout_logfile=/var/log/supervisor/frontend.log
stderr_logfile=/var/log/supervisor/frontend_err.log

; The only process actually reachable from outside this container --
; reverse-proxies /api/* and /health to the api program and everything
; else to the frontend program, on whatever $PORT the host platform
; injects (rendered into tradingos.conf by allinone-entrypoint.sh before
; this starts).
[program:nginx]
command=nginx -g 'daemon off;'
user=root
autorestart=true
priority=30
startsecs=3
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx_err.log
