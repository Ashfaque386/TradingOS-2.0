[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:postgres]
command=/usr/lib/postgresql/16/bin/postgres -D %(ENV_PGDATA)s
user=postgres
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/postgres.log
stderr_logfile=/var/log/supervisor/postgres_err.log

[program:api]
command=/app/scripts/api-entrypoint.sh
directory=/app
user=root
autorestart=true
priority=20
startsecs=5
; Forwarded to the container's own stdout/stderr (not a file inside it)
; so `docker compose logs backend` shows every API request/error and the
; api-entrypoint.sh startup warnings -- a file here hid the
; SECRETS_ENCRYPTION_KEY warning entirely (Phase 17 Settings fix).
; maxbytes=0 is required: supervisord can't rotate a pipe.
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
