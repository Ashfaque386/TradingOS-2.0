[project]
name = "tradingos-backend"
version = "0.1.0"
description = "TradingOS 2.0 backend — API, orchestration, agents, engine"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "sqlalchemy>=2.0.36,<2.1",
    "asyncpg>=0.30,<0.31",
    "psycopg2-binary>=2.9,<3.0",
    "alembic>=1.13,<1.14",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "python-jose[cryptography]>=3.3,<4.0",
    "passlib[argon2]>=1.7,<2.0",
    "python-multipart>=0.0.12,<0.1",
    "email-validator>=2.2,<3.0",
    "structlog>=24.4,<25.0",
    "watchdog>=5.0,<6.0",
    "json5>=0.9,<0.10",
    "click>=8.1,<9.0",
    "redis>=5.1,<6.0",
    "langgraph>=0.2,<0.3",
    # Runtime dependency, not just a dev tool, as of Phase 4: src/engine/validation.py
    # shells out to it for static validation of every LLM-generated strategy module
    # before anything reaches the sandbox.
    "ruff>=0.7,<0.8",
    # Phase 5 (Build Spec §10): the vectorized backtest engine and
    # optimization suite.
    "pandas>=2.2,<2.3",
    "numpy>=1.26,<2.0",
    "optuna>=3.6,<3.7",
    # optuna.importance.FanovaImportanceEvaluator (the real fANOVA
    # evaluator, not a stub) needs scikit-learn's RandomForestRegressor
    # internally.
    "scikit-learn>=1.4,<1.5",
    "temporalio>=1.7,<1.8",
    # Phase 7 (Build Spec §11): autonomous daily-cron + intraday-interval
    # scheduling for the paper trading engine.
    "apscheduler>=3.10,<3.11",
    # zoneinfo's IANA database isn't guaranteed to be present on every base
    # image -- this package bundles it so "Asia/Kolkata" resolves the same
    # everywhere regardless of OS tzdata.
    "tzdata>=2024.2",
    # Phase 8 (Build Spec §13): real httpx-calling broker adapters
    # (Zerodha Kite Connect, Upstox) -- moved out of dev-only now that
    # it's exercised by non-test code, not just FastAPI's TestClient.
    "httpx>=0.27,<0.28",
    # Phase 8 (Build Spec §3, §20): the encrypted local secrets store for
    # broker credentials. Already pulled in transitively by
    # python-jose[cryptography] above, but pinned explicitly now that
    # src/security/secrets_store.py imports cryptography.fernet directly
    # rather than relying on another package's transitive dependency.
    "cryptography>=43,<44",
    # Phase 10 (Build Spec §14): the DuckDB + Parquet data lake. DuckDB
    # writes/reads Parquet itself (COPY ... (FORMAT PARQUET) / read_parquet)
    # so no separate pyarrow dependency is needed just for storage.
    "duckdb>=1.1,<2.0",
    # Phase 11 (Build Spec §19): Prometheus metrics (src/observability/metrics.py).
    "prometheus-client>=0.20,<0.21",
]

[project.scripts]
tradingos-cli = "src.gateway.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<0.25",
    # Build Spec §21-22 hardening pass: mutation testing (actual
    # mutation-kill rate, not just line coverage) for the risk-critical
    # modules -- run with `mutmut run`, see [tool.mutmut] below for scope
    # and why this is pinned below 3.0.
    "mutmut>=2.4,<3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mutmut]
# Build Spec §21-22 hardening pass: scoped to the pure, deterministic
# risk-critical logic named in that pass (Kill Switch, Compliance
# Checker, correlation constraint) -- not the whole codebase, which
# would take far too long to be run routinely and would mostly mutate
# code with no bearing on capital-at-risk decisions. live-intent expiry
# (src/orchestration/live_trading.py::expire_stale_intents) is
# DB-orchestration code with the rest of that 700-line file around it;
# it's covered by a hand-driven mutation analysis instead (see
# tests/test_orchestration_live_trading.py's expiry tests' docstrings),
# not by this automated config, to avoid mutating hundreds of unrelated
# lines just to reach one function.
#
# Pinned to mutmut>=2.4,<3.0 (not the 3.x this project's dev extra names
# below): mutmut 3.8.0's stats/trampoline instrumentation has a hardcoded
# `assert not name.startswith("src.")`, which trips on this repo's own
# package (literally named `src`, as in every `from src.x import y`) --
# confirmed live, not assumed. mutmut 2.x's simpler mutate-in-place/rerun
# model has no such assertion.
paths_to_mutate = "src/engine/risk/kill_switch.py,src/engine/risk/compliance.py,src/engine/risk/correlation_constraint.py,src/orchestration/kill_switch.py"
# Only the tests that actually exercise these modules -- the full suite
# (~700 tests, ~2.5 minutes) re-run per surviving mutant would make a
# routine mutation-testing run impractically slow.
runner = ".venv/bin/python -m pytest -x tests/test_engine_kill_switch.py tests/test_engine_compliance.py tests/test_engine_correlation_constraint.py tests/test_orchestration_kill_switch.py"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends()-as-a-default-argument is the framework's own
# dependency-injection idiom, not the mutable-default-argument bug B008
# exists to catch.
ignore = ["B008"]
