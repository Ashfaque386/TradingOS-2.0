[project]
name = "tradingos-backend"
version = "0.1.0"
description = "TradingOS 2.0 backend — API, orchestration, agents, engine"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "sqlalchemy>=2.0.36,<2.1",
    "asyncpg>=0.30,<0.31",
    "psycopg2-binary>=2.9,<3.0",
    "alembic>=1.13,<1.14",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "python-jose[cryptography]>=3.3,<4.0",
    "passlib[argon2]>=1.7,<2.0",
    "python-multipart>=0.0.12,<0.1",
    "email-validator>=2.2,<3.0",
    "structlog>=24.4,<25.0",
    "watchdog>=5.0,<6.0",
    "json5>=0.9,<0.10",
    "click>=8.1,<9.0",
    "redis>=5.1,<6.0",
]

[project.scripts]
tradingos-cli = "src.gateway.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<0.25",
    "httpx>=0.27,<0.28",
    "ruff>=0.7,<0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends()-as-a-default-argument is the framework's own
# dependency-injection idiom, not the mutable-default-argument bug B008
# exists to catch.
ignore = ["B008"]
