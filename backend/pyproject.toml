[project]
name = "tradingos-backend"
version = "0.1.0"
description = "TradingOS 2.0 backend — API, orchestration, agents, engine"
requires-python = ">=3.12,<3.13"
dependencies = [
    # >=0.141: 0.115.14's pinned starlette (0.46.2) had 6 real CVEs
    # (PYSEC-2026-1941/1942/161/2281/2280/249/248, only fully fixed in
    # starlette>=1.3.1) -- closed in Phase 26's dependency-CVE pass,
    # docs/phase20-old-vs-new-comparison.md item 28, by bumping FastAPI to
    # the version whose own pin resolves a fixed starlette.
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.32,<0.33",
    "sqlalchemy>=2.0.36,<2.1",
    "asyncpg>=0.30,<0.31",
    "psycopg2-binary>=2.9,<3.0",
    "alembic>=1.13,<1.14",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    # Phase 26 (docs/phase20-old-vs-new-comparison.md item 28) dependency-
    # CVE pass: pulls in `ecdsa` transitively (python-jose's EC-algorithm
    # support), which carries CVE-2024-23342 (a Minerva timing side-channel
    # in ECDSA signing/keygen/ECDH -- explicitly *not* signature
    # verification) with no fix version; the ecdsa project has stated side-
    # channel attacks are out of scope and there is no planned fix. Left
    # as-is, deliberately, not swapped for another JWT library: this app's
    # own `settings.jwt_algorithm` default is "HS256" (`src/core/config.py`)
    # -- pure HMAC, never touching `ecdsa`'s vulnerable EC signing code path
    # at all -- so the finding is real in the dependency tree but
    # unreachable through this codebase's actual runtime behavior.
    "python-jose[cryptography]>=3.3,<4.0",
    "passlib[argon2]>=1.7,<2.0",
    "python-multipart>=0.0.12,<0.1",
    "email-validator>=2.2,<3.0",
    "structlog>=24.4,<25.0",
    "watchdog>=5.0,<6.0",
    "json5>=0.9,<0.10",
    "click>=8.1,<9.0",
    "redis>=5.1,<6.0",
    # >=1.2,<1.3: 0.2.76 had 2 real CVEs (PYSEC-2026-83, only fixed in
    # langgraph>=1.0.10; PYSEC-2026-2194) -- closed in Phase 26's
    # dependency-CVE pass, docs/phase20-old-vs-new-comparison.md item 28.
    # Pulls compatible langgraph-checkpoint/langgraph-sdk/langchain-core
    # versions too, which had their own real CVEs at the old pin.
    "langgraph>=1.2,<1.3",
    # Runtime dependency, not just a dev tool, as of Phase 4: src/engine/validation.py
    # shells out to it for static validation of every LLM-generated strategy module
    # before anything reaches the sandbox.
    "ruff>=0.7,<0.8",
    # Phase 5 (Build Spec §10): the vectorized backtest engine and
    # optimization suite.
    "pandas>=2.2,<2.3",
    "numpy>=1.26,<2.0",
    "optuna>=3.6,<3.7",
    # optuna.importance.FanovaImportanceEvaluator (the real fANOVA
    # evaluator, not a stub) needs scikit-learn's RandomForestRegressor
    # internally.
    # >=1.5: 1.4.2 has PYSEC-2024-110 (a real CVE, closed in Phase 26's
    # dependency-CVE pass, docs/phase20-old-vs-new-comparison.md item 28).
    "scikit-learn>=1.5,<1.6",
    "temporalio>=1.7,<1.8",
    # Phase 7 (Build Spec §11): autonomous daily-cron + intraday-interval
    # scheduling for the paper trading engine.
    "apscheduler>=3.10,<3.11",
    # zoneinfo's IANA database isn't guaranteed to be present on every base
    # image -- this package bundles it so "Asia/Kolkata" resolves the same
    # everywhere regardless of OS tzdata.
    "tzdata>=2024.2",
    # Phase 8 (Build Spec §13): real httpx-calling broker adapters
    # (Zerodha Kite Connect, Upstox) -- moved out of dev-only now that
    # it's exercised by non-test code, not just FastAPI's TestClient.
    "httpx>=0.27,<0.28",
    # Phase 8 (Build Spec §3, §20): the encrypted local secrets store for
    # broker credentials. Already pulled in transitively by
    # python-jose[cryptography] above, but pinned explicitly now that
    # src/security/secrets_store.py imports cryptography.fernet directly
    # rather than relying on another package's transitive dependency.
    # >=50: 43.0.3 had 5 real CVEs (PYSEC-2026-1284/2141/35/3553/3554,
    # GHSA-537c-gmf6-5ccf), closed in Phase 26's dependency-CVE pass,
    # docs/phase20-old-vs-new-comparison.md item 28 -- a 6th
    # (PYSEC-2026-3552) was disclosed after that pass's own initial pip-
    # audit run and caught by re-running it after the upgrade, fixed in
    # 50.0.0.
    "cryptography>=50,<51",
    # Phase 10 (Build Spec §14): the DuckDB + Parquet data lake. DuckDB
    # writes/reads Parquet itself (COPY ... (FORMAT PARQUET) / read_parquet)
    # so no separate pyarrow dependency is needed just for storage.
    "duckdb>=1.1,<2.0",
    # Phase 11 (Build Spec §19): Prometheus metrics (src/observability/metrics.py).
    "prometheus-client>=0.20,<0.21",
    # Phase 17 real-world testing pass: real host CPU/memory gauges for
    # GET /api/v1/system/vitals (src/observability/vitals.py) -- read
    # directly from the API process's own OS view, not derived from any
    # Prometheus metric (none of the five this app tracks are host-level).
    "psutil>=6.0,<7.0",
]

[project.scripts]
tradingos-cli = "src.gateway.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<0.25",
    # Build Spec §21-22 hardening pass: mutation testing (actual
    # mutation-kill rate, not just line coverage) for the risk-critical
    # modules -- run with `mutmut run`, see [tool.mutmut] below for scope
    # and why this is pinned below 3.0.
    "mutmut>=2.4,<3.0",
    # Phase 26 (docs/phase20-old-vs-new-comparison.md item 28): the CI
    # hardening tools the old app's pipeline ran that this one didn't --
    # ruff/pytest/tsc were already in CI before this phase.
    "pytest-cov>=6.0,<7.0",
    "mypy>=1.13,<2.0",
    "bandit>=1.7,<2.0",
    "pip-audit>=2.7,<3.0",
    # Phase 26 follow-up (mypy --strict backlog pass): real published stub
    # packages for third-party libraries this codebase imports directly but
    # that don't ship their own inline types -- closes the `[import-untyped]`
    # class of the original 428-error backlog without silencing real
    # per-usage errors the way a blanket `ignore_missing_imports` would.
    # `apscheduler` has no published stub package (checked: no
    # `APScheduler-stubs`/`types-apscheduler` on PyPI) -- handled instead via
    # `[[tool.mypy.overrides]]` below.
    "pandas-stubs>=2.2,<2.3",
    "types-passlib>=1.7,<2.0",
    "types-python-jose>=3.3,<4.0",
    "types-psutil>=6.0,<7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mutmut]
# Build Spec §21-22 hardening pass: scoped to the pure, deterministic
# risk-critical logic named in that pass (Kill Switch, Compliance
# Checker, correlation constraint) -- not the whole codebase, which
# would take far too long to be run routinely and would mostly mutate
# code with no bearing on capital-at-risk decisions. live-intent expiry
# (src/orchestration/live_trading.py::expire_stale_intents) is
# DB-orchestration code with the rest of that 700-line file around it;
# it's covered by a hand-driven mutation analysis instead (see
# tests/test_orchestration_live_trading.py's expiry tests' docstrings),
# not by this automated config, to avoid mutating hundreds of unrelated
# lines just to reach one function.
#
# Pinned to mutmut>=2.4,<3.0 (not the 3.x this project's dev extra names
# below): mutmut 3.8.0's stats/trampoline instrumentation has a hardcoded
# `assert not name.startswith("src.")`, which trips on this repo's own
# package (literally named `src`, as in every `from src.x import y`) --
# confirmed live, not assumed. mutmut 2.x's simpler mutate-in-place/rerun
# model has no such assertion.
paths_to_mutate = "src/engine/risk/kill_switch.py,src/engine/risk/compliance.py,src/engine/risk/correlation_constraint.py,src/orchestration/kill_switch.py"
# Only the tests that actually exercise these modules -- the full suite
# (~700 tests, ~2.5 minutes) re-run per surviving mutant would make a
# routine mutation-testing run impractically slow.
runner = ".venv/bin/python -m pytest -x tests/test_engine_kill_switch.py tests/test_engine_compliance.py tests/test_engine_correlation_constraint.py tests/test_orchestration_kill_switch.py"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends()-as-a-default-argument is the framework's own
# dependency-injection idiom, not the mutable-default-argument bug B008
# exists to catch.
ignore = ["B008"]

[tool.bandit]
# Phase 26 (docs/phase20-old-vs-new-comparison.md item 28): every other
# finding class stays active and is reviewed per-site with a targeted
# `# nosec BXXX: <reason>` comment where it's a real, intentional pattern
# (the strategy sandbox's own subprocess/exec use, the audit archive's
# `chattr` call, etc.) -- these two are skipped project-wide because they
# fire on the mere shape of the code, not on anything a per-site review
# could meaningfully judge:
#   B101 (assert_used): this codebase runs without `-O` (asserts are
#     never stripped) and never relies on an assert as its ONLY
#     enforcement of anything security-relevant -- every real instance
#     found (roster length invariants, sandbox internal-state checks) is
#     a fail-fast sanity check, not access control.
#   B404 (import subprocess): fires on the bare `import subprocess`
#     line itself, before any call is even made -- the real risk lives in
#     B603/B607 at each actual call site, which stay active.
skips = ["B101", "B404"]

[tool.mypy]
# Phase 26 (docs/phase20-old-vs-new-comparison.md item 28): a real
# `mypy --strict` run against this codebase (never type-checked this
# strictly before) found 428 errors across 136 of 249 source files --
# genuinely too large a backlog to clear as part of adding the check
# itself, so it was wired into CI as `continue-on-error` at first (real
# errors visible on every build, never gating a merge on a pre-existing
# backlog). A follow-up pass (same Phase 26 item) then closed all 428,
# file by file -- real stub packages for the untyped-import class (see
# the dev extra above and the apscheduler override below), generic
# type-args, SQLAlchemy Result.rowcount/Column-vs-InstrumentedAttribute
# casts, a Role re-export fix, real None-safety asserts backed by FK/
# invariant review, and missing annotations -- never a blanket
# `ignore_missing_imports`/`disable_error_code` sweep. `continue-on-error`
# stays on the CI step regardless (see .github/workflows/ci.yml's own
# comment): a clean run today doesn't guarantee every future PR's author
# reads a red mypy step as blocking before this project has a stated
# policy on it, so the step is real and visible, not yet a merge gate.
strict = true
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
# `apscheduler` ships no inline types and has no published stub package
# (checked: no `APScheduler-stubs`/`types-apscheduler` on PyPI) -- every
# other untyped-import case in this codebase's original 428-error backlog
# (pandas, passlib, jose, psutil) was closed instead with a real stub
# package in the `dev` extra above, which this one genuinely has none for.
module = ["apscheduler.*"]
ignore_missing_imports = true
