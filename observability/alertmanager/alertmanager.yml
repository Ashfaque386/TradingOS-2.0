# Alertmanager (Phase 5): the one receiver is the TradingOS backend itself. Prometheus evaluates
# observability/prometheus/alert_rules.yml and sends what fires here; Alertmanager groups it and
# posts it to POST /api/v1/webhooks/alertmanager, which records it as an engine alert episode and
# tells the channels subscribed to the `engine` alert level (Settings > Notification channels).
#
# The call is authenticated with a bearer token the backend creates on first boot, on a volume of
# its own that this container mounts read-only (src/notifications/alertmanager_token.py). The file
# is read again on every request, so rotating it needs no restart here.
#
# `send_resolved: true` is what lets the backend close the episode and say "cleared". Alertmanager
# repeats a still-firing alert every `repeat_interval`; the backend counts that as the same
# episode and does not message again.
#
# One limit: if the backend is down it cannot receive this call, so an alert about the backend
# being down is visible in Prometheus/Grafana but reaches no channel through here.
global:
  resolve_timeout: 5m

route:
  receiver: tradingos-backend
  group_by: ["alertname"]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h

receivers:
  - name: tradingos-backend
    webhook_configs:
      - url: http://backend:8000/api/v1/webhooks/alertmanager
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/token/webhook_token
