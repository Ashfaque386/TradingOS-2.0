name: tradingos-2-0

services:
  backend:
    build:
      context: ./backend
    image: tradingos-2.0-backend:latest
    container_name: TradingOS-2.0-Backend
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
    environment:
      ENV: ${ENV:-development}
      POSTGRES_USER: ${POSTGRES_USER:-tradingos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tradingos}
      POSTGRES_DB: ${POSTGRES_DB:-tradingos}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tradingos}:${POSTGRES_PASSWORD:-tradingos}@localhost:5432/${POSTGRES_DB:-tradingos}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      # Tracks wherever the frontend actually got published, not just its
      # default port -- scripts/docker-up.js bumps FRONTEND_HOST_PORT when
      # 3000 is taken, and without this the browser's fetch/WebSocket
      # calls get silently CORS-blocked (which the frontend can only
      # report as a generic "unreachable" network error, not a 403).
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:${FRONTEND_HOST_PORT:-3000}}
      # Broker OAuth sends the browser back to the Settings page here, on
      # the frontend's (possibly launcher-bumped) port -- not the backend's.
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:${FRONTEND_HOST_PORT:-3000}}
      AGENT_GATEWAY_CONFIG_PATH: /app/config/tradingos.config.json
      NSE_HOLIDAYS_PATH: /app/config/nse_holidays.json
      # redis/temporal are their own containers/images (no Postgres+API-style
      # coupling reason applies to either) — reached over the Docker network
      # by service name, not localhost.
      REDIS_URL: redis://redis:6379/0
      TEMPORAL_ADDRESS: temporal:7233
      # Phase 17 real-world testing pass: GET /api/v1/system/vitals queries
      # Prometheus's own HTTP API for a real order-dispatch-latency
      # percentile (src.observability.vitals) -- in-network hostname, same
      # convention as TEMPORAL_ADDRESS above. Prometheus isn't in `backend`'s
      # own depends_on (it depends the other way, on `backend` being
      # healthy) -- the vitals endpoint tolerates that ordering and reports
      # both percentiles as null until Prometheus is actually reachable.
      PROMETHEUS_URL: http://prometheus:9090
      # Opt-in: unset by default, so a stock deployment never gets a
      # hardcoded credential baked in. Set both in .env to have the
      # container ensure this SystemAdministrator user exists on every
      # boot (idempotent — safe to leave set across restarts).
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-}
      # Broker credentials store (Build Spec §3, §20). Unset by default --
      # broker-credentials writes and Shadow Mode checks 503 until this is
      # set; the paper trading engine itself runs fine without it (mock
      # tick feed fallback, src.brokers.tick_source.build_tick_source).
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-}
      SECRETS_STORE_PATH: /app/secrets/broker_credentials.enc
    security_opt:
      # Docker's default seccomp profile plus exactly one rule: unshare()
      # for user+network namespaces only, which the strategy sandbox needs
      # to cut its worker off the network (src/engine/sandbox/
      # process_runtime.py). No added capabilities -- the far broader
      # cap_add: SYS_ADMIN alternative was deliberately rejected.
      - seccomp=./deploy/seccomp/backend.json
    extra_hosts:
      # Lets the backend reach a host-machine service (e.g. a local Ollama
      # instance at 11434) via `host.docker.internal` from inside this
      # container. Docker Desktop (Windows/Mac) already resolves this name
      # on its own -- this line is what makes it also resolve under plain
      # Docker Compose on Linux, where it otherwise doesn't exist at all.
      - "host.docker.internal:host-gateway"
    ports:
      # API_HOST_PORT always publishes — it's the only way to reach the app.
      # BIND_HOST defaults to loopback-only: this port serves the entire
      # Agent Gateway config/CLI-mutation surface (Build Spec §21-22), not
      # just paper-trading demo data, so it should not be reachable from
      # other machines on the network by default. Set BIND_HOST=0.0.0.0 (or
      # a specific interface IP) only if you deliberately want that, e.g.
      # reaching the Console from another device on your own LAN.
      - "${BIND_HOST:-127.0.0.1}:${API_HOST_PORT:-8000}:8000"
      # Postgres (5432) is deliberately NOT published here: the API reaches
      # it over localhost inside this same container. To reach it from a
      # host tool (psql, a GUI client), opt in to
      # docker-compose.postgres-port.yml (see its header). It can't live
      # here behind an empty-by-default variable: Compose has no
      # conditional ports, and a bare "5432" entry publishes on a random
      # host port bound to 0.0.0.0 (seen live: 0.0.0.0:53790->5432, i.e.
      # the whole LAN, default password).
    volumes:
      - tradingos-2.0_pgdata:/var/lib/postgresql/data
      # Bind mount, not a named volume: config/tradingos.config.json is
      # meant to be hand-edited from the host while the container runs —
      # the Agent Gateway hot-reloads on any change (Build Spec §6.2).
      - ./config:/app/config
      # The encrypted Settings stores (broker_credentials.enc,
      # llm_provider_credentials.enc, notification_channels.enc -- all
      # under /app/secrets, see src/core/config.py) must outlive the
      # container: without this, the documented `docker compose down &&
      # up --build` recreate silently wiped every saved broker/LLM/
      # notification credential. Named volume (not a bind mount) so the
      # store's 0600 file permissions hold on Docker Desktop for Windows.
      # Useless without the same SECRETS_ENCRYPTION_KEY each boot -- back
      # that key up alongside this volume.
      - tradingos-2.0_secrets:/app/secrets
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      args:
        # Baked into the client bundle at build time (see Dockerfile) --
        # the browser reaches the backend over its published host port.
        # Derived from API_HOST_PORT (not a hardcoded 8000 literal) so a
        # manually-changed or dynamically-bumped backend port
        # (scripts/docker-up.js) is picked up automatically; set
        # NEXT_PUBLIC_API_URL/WS_URL directly only if the browser needs to
        # reach the backend by a different host than "localhost" (e.g. a
        # LAN IP).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${API_HOST_PORT:-8000}}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:${API_HOST_PORT:-8000}}
    image: tradingos-2.0-frontend:latest
    container_name: TradingOS-2.0-Frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Same BIND_HOST default as the backend above (loopback-only) -- the
      # Console is the human control surface for the whole system
      # (strategy approvals, kill switch, Agent Gateway config), so it
      # shouldn't be reachable off the host by default either.
      - "${BIND_HOST:-127.0.0.1}:${FRONTEND_HOST_PORT:-3000}:3000"

  redis:
    image: redis:7-alpine
    container_name: TradingOS-2.0-Redis
    restart: unless-stopped
    # Not published to the host: only the backend talks to it, over the
    # internal Docker network — same "don't publish a port unless something
    # outside the container needs it" rule as Postgres.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  temporal:
    # Single-node dev server (Build Spec §10: Monte Carlo "distributed via
    # Temporal") -- the official `temporal server start-dev` quick-start
    # pattern: one self-contained process, no separate persistence backend
    # to stand up. NOT verified by actually pulling/running this image in
    # this project's own dev sandbox: the image layer download was
    # blocked by that environment's egress policy on the image CDN
    # (confirmed live, not assumed) -- same "real config, honestly
    # unexercised without reachable infra" posture as
    # src/engine/optimization/temporal_workflows.py. Verify this service
    # comes up cleanly the first time you `docker compose up` it for real.
    image: temporalio/temporal:latest
    container_name: TradingOS-2.0-Temporal
    restart: unless-stopped
    command: ["server", "start-dev", "--ip", "0.0.0.0"]
    # Not published to the host: only the backend/workers talk to it, over
    # the internal Docker network — same "don't publish unless something
    # outside the container needs it" rule as Postgres/Redis.
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  prometheus:
    # Scrapes the backend's GET /metrics (Build Spec §19, item 4) — real
    # config, same "not verified end-to-end in this sandbox" posture as
    # `temporal` above: Docker Hub pulls are blocked by this environment's
    # egress policy, confirmed live via the identical `docker pull`
    # failure pattern seen on `temporalio/temporal:latest` in Phase 5.
    # Please confirm `docker compose up` once in a normal environment.
    image: prom/prometheus:latest
    container_name: TradingOS-2.0-Prometheus
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - tradingos-2.0_prometheus_data:/prometheus
    ports:
      # Published by default (unlike Postgres/Redis/Temporal): an operator
      # needs to reach Prometheus's own UI (rule/alert status) directly,
      # the same "something outside the container needs it" reasoning
      # that already applies to the API and frontend ports. Same BIND_HOST
      # default (loopback-only) as those, though -- Prometheus has no auth
      # of its own at all.
      - "${BIND_HOST:-127.0.0.1}:${PROMETHEUS_HOST_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  grafana:
    # Dashboard + alert visualization (Build Spec §19, item 5). Same
    # unverified-in-this-sandbox posture as `prometheus`/`temporal` above.
    image: grafana/grafana:latest
    container_name: TradingOS-2.0-Grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Forces a password change on first real login rather than shipping
      # a permanently-valid default credential — same "no baked-in
      # credential by default" posture as DEFAULT_ADMIN_EMAIL/PASSWORD.
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      # The dashboard JSON lives under provisioning/dashboards/json/ on
      # the host (not a separate top-level observability/grafana/dashboards/
      # directory) so this is a single bind mount, not two nested ones —
      # a bind mount targeting a path *inside* another read-only bind
      # mount fails to create its mountpoint on Docker Desktop for
      # Windows ("read-only file system"), even though it can work on
      # native Linux Docker. One mount avoids the nesting entirely.
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - tradingos-2.0_grafana_data:/var/lib/grafana
    ports:
      # Default 3001, not 3000 — 3000 is already the frontend's default
      # (FRONTEND_HOST_PORT), and this repo's own `docker-up.js`/`.ps1`
      # port-conflict story (see docs/CLAUDE.md's Phase 1 entry) is exactly
      # what picking a colliding default here would reintroduce. Same
      # BIND_HOST default (loopback-only) as the others -- especially
      # relevant here since Grafana ships with an admin/admin default
      # login until someone changes it.
      - "${BIND_HOST:-127.0.0.1}:${GRAFANA_HOST_PORT:-3001}:3000"

volumes:
  tradingos-2.0_pgdata:
    name: tradingos-2.0_pgdata
  tradingos-2.0_secrets:
    name: tradingos-2.0_secrets
  tradingos-2.0_prometheus_data:
    name: tradingos-2.0_prometheus_data
  tradingos-2.0_grafana_data:
    name: tradingos-2.0_grafana_data
