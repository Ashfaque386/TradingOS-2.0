name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # A `v*` tag publishes a versioned image too (see the `images` job).
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Runners are pinned to ubuntu-24.04 instead of `ubuntu-latest`. GitHub starts
# moving the `ubuntu-latest` label to Ubuntu 26 on 2026-10-19 (gradually, until
# 2026-11-19), and this pipeline depends on things that change between
# releases: the AppArmor user-namespace sysctl the strategy sandbox needs,
# Playwright's system libraries, and the apt packages. Moving to 26 should be a
# deliberate, tested change, not something that happens to a passing main on
# the date GitHub picks. (Today `ubuntu-latest` *is* 24.04, so the pin changes
# nothing yet.) To try 26 early, change one job's label to `ubuntu-26.04` on a
# branch and watch it run.
jobs:
  secrets-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Phase 26 (docs/phase20-old-vs-new-comparison.md item 28): a real
      # run against this repo's full history found exactly one false
      # positive (a Docker volume name, not a secret), scoped out in
      # .gitleaks.toml's own allowlist -- not a broad path exclusion, so a
      # real secret anywhere else still fails this job.
      #
      # The scanner version is pinned on purpose. gitleaks-action (v2 and v3) defaults
      # to 8.24.3 -- not the latest release -- so findings reproduced with
      # `docker run zricethezav/gitleaks:latest` can differ from what this job
      # reports (a test-fixture key passed 8.30.1 locally and failed here).
      # Reproduce with the pinned version instead:
      #   docker run --rm -v "$PWD:/repo" -w /repo -e GITLEAKS_CONFIG=.gitleaks.toml       #     zricethezav/gitleaks:v8.24.3 detect -v --redact
      # .pre-commit-config.yaml pins the same version.
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_VERSION: 8.24.3
          GITLEAKS_CONFIG: .gitleaks.toml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend (pytest, ruff, bandit, mypy, pip-audit)
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tradingos
          POSTGRES_PASSWORD: tradingos
          POSTGRES_DB: tradingos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: "Install backend (+ dev extras: pytest, ruff, bandit, mypy, pip-audit)"
        working-directory: backend
        # pip itself is audited below, and the runner's pip lags behind its
        # own fixed versions -- bring it current before installing anything.
        run: python -m pip install --upgrade pip && pip install ".[dev]"

      # config/tradingos.config.json and config/nse_holidays.json live at
      # the repo root and reach the backend container at runtime via
      # docker-compose.yml's bind mount (./config:/app/config onto
      # WORKDIR /app). Running pytest directly (not in that container) needs
      # the same layout relative to its own cwd -- same workaround used to
      # run the full suite locally against the backend image in Phase 17's
      # real-Docker testing pass (docs/phase17-realworld-testing.md).
      - name: Make repo-root config reachable at backend/config
        run: cp -r config backend/config

      # ubuntu-24.04 (pinned, see the top of this file) restricts unprivileged
      # user namespaces via AppArmor by default
      # (kernel.apparmor_restrict_unprivileged_userns=1). The strategy
      # sandbox (src/engine/sandbox/process_runtime.py) creates its network
      # namespace with `unshare --user --map-root-user --net` specifically
      # so it needs no added capability -- deploy/seccomp/backend.json is
      # the Docker-container counterpart of this same fix -- but pytest
      # runs as a bare process here, not inside that image, so it's this
      # kernel restriction (not Docker's seccomp) that has to be lifted.
      # Confirmed live: every test in test_strategies_api.py and
      # test_engine_sandbox.py that exercises the real sandbox fails with
      # "unshare: unshare failed: Operation not permitted" without this.
      - name: Allow unprivileged user namespaces (needed by the strategy sandbox)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: ruff check
        working-directory: backend
        run: ruff check src tests

      - name: ruff format --check
        working-directory: backend
        run: ruff format --check src tests

      # Phase 26 (docs/phase20-old-vs-new-comparison.md item 28): a real
      # SAST pass. Every finding was individually reviewed -- genuine false
      # positives (Prometheus label kwargs, the sandbox's own intentional
      # subprocess/exec use, bound-parameter SQL with a hardcoded column
      # name) got a targeted `# nosec BXXX: <reason>` at the exact site,
      # never a blanket rule skip beyond the two documented in
      # [tool.bandit] (B101/B404, which fire on the shape of the code, not
      # anything a per-site review could judge) -- and two real ones
      # (a `/tmp`-hardcoded sandbox scratch path, two bare `except: pass`
      # blocks swallowing a broker margin lookup failure with no log line)
      # were actually fixed. Blocking: the backlog this uncovered is
      # already cleared, so a NEW real finding should fail the build, not
      # join a queue nobody reviews.
      - name: bandit
        working-directory: backend
        run: bandit -c pyproject.toml -r src -q

      # Blocking. The original 428-error backlog (see [tool.mypy] in
      # pyproject.toml) is closed and `mypy src` is at zero, so a type error
      # now fails the build instead of scrolling past in a log nobody reads.
      - name: mypy --strict
        working-directory: backend
        run: mypy src

      # Blocking. The findings that used to keep this advisory are gone:
      # python-jose (and its unfixable `ecdsa`) was replaced by PyJWT, the
      # langgraph bump landed in Phase 26, `pytest` is on a fixed 9.x (its pin
      # was lifted for exactly this) and `pip` is upgraded above. What this
      # means in practice: a CVE published against any dependency fails the
      # next build -- including an unrelated one -- until the dependency is
      # bumped, or the finding is acknowledged with an explicit
      # `--ignore-vuln <ID>` here, with the reason beside it. It also blocks
      # the image jobs, which `need` this one.
      - name: pip-audit
        working-directory: backend
        run: pip-audit

      # Two coverage gates. The global floor (85, set 2026-10-13 against a
      # measured 87.1%) catches broad erosion; scripts/check_coverage.py then
      # holds the safety layer and every top-level package to its own floor
      # from `[tool.tradingos.coverage]` in pyproject.toml, because an average
      # cannot see the Kill Switch sliding while everything else improves.
      - name: pytest (with coverage)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://tradingos:tradingos@localhost:5432/tradingos_test
          REDIS_URL: redis://localhost:6379/0
        run: pytest -q --cov=src --cov-report=term-missing --cov-report=json --cov-fail-under=85

      - name: per-module coverage floors
        working-directory: backend
        run: python scripts/check_coverage.py

  # Mutation testing of the deterministic safety layer. Line coverage shows a
  # test ran a line; this shows it would notice the line being wrong (mutmut
  # rewrites `<` to `<=`, `and` to `or`, `* 100` to `* 101` and re-runs that
  # module's own tests). One job per module so they run in parallel -- mutmut
  # has no parallel mode and a module takes minutes. Each fails if more mutants
  # survive than the baseline in `[[tool.tradingos.mutation.module]]`
  # (pyproject.toml); a test in backend/tests keeps this list and that one in
  # step. Deliberately not a prerequisite of the image jobs: a slow gate should
  # not delay publishing, though a red run still says the safety tests slipped.
  mutation:
    name: Mutation (${{ matrix.module }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        module:
          - src/engine/risk/kill_switch.py
          - src/engine/risk/compliance.py
          - src/engine/risk/correlation_constraint.py
          - src/orchestration/kill_switch.py
          - src/orchestration/risk_gate.py
          - src/orchestration/risk_limits.py
          - src/engine/risk/go_live_gate.py
          - src/engine/risk/circuit_breaker.py
          - src/engine/options_grounding.py
          - src/orchestration/live_intent_expiry.py

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tradingos
          POSTGRES_PASSWORD: tradingos
          POSTGRES_DB: tradingos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend (+ dev extras, which carry mutmut)
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install ".[dev]"

      - name: Make repo-root config reachable at backend/config
        run: cp -r config backend/config

      - name: Mutate ${{ matrix.module }} and compare with the baseline
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://tradingos:tradingos@localhost:5432/tradingos_test
          REDIS_URL: redis://localhost:6379/0
        run: python scripts/mutation_gate.py ${{ matrix.module }}

  e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-24.04
    # A real backend+frontend+Postgres+Redis stack, driven by the actual
    # Playwright specs in e2e/ (Phase 26, docs/phase20-old-vs-new-comparison.md
    # item 29) -- these already existed but were never wired into CI.
    # Every env var/port/database name below matches e2e/README.md's own
    # documented local setup exactly, since that's the one place this
    # suite's real requirements are recorded.

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tradingos
          POSTGRES_PASSWORD: tradingos
          POSTGRES_DB: tradingos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Install Playwright + Chromium
        run: pnpm exec playwright install --with-deps chromium

      # e2e/utils.ts::runSeedScript hardcodes `backend/.venv/bin/python` --
      # live-autonomy.spec.ts calls it mid-test, so this exact venv path
      # has to exist, not just "python installed somewhere on PATH".
      - name: Create backend venv and install
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"

      - name: Make repo-root config reachable at backend/config
        run: cp -r config backend/config

      # Same real constraint as the backend job's own sandbox step --
      # strategy-lifecycle.spec.ts drives the actual strategy pipeline
      # through the real sandbox.
      - name: Allow unprivileged user namespaces (needed by the strategy sandbox)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Migrate the e2e database to head
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://tradingos:tradingos@localhost:5432/tradingos
        run: .venv/bin/python -m alembic upgrade head

      - name: Seed e2e fixture users
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://tradingos:tradingos@localhost:5432/tradingos
          JWT_SECRET_KEY: dev-only-secret-do-not-use-in-production
        run: .venv/bin/python scripts/seed_e2e_users.py

      # A pipeline run whose process "died": events that just stop, ten minutes
      # old. It is planted before the backend starts on purpose, so that the
      # backend's startup sweep is what ends it -- e2e/pipeline-abandoned.spec.ts
      # checks the `pipeline.abandoned` event is there. The id must match the spec.
      - name: Seed a pipeline run left behind by a dead process
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://tradingos:tradingos@localhost:5432/tradingos
          JWT_SECRET_KEY: dev-only-secret-do-not-use-in-production
        run: >-
          .venv/bin/python scripts/seed_e2e_pipeline_run.py
          --run-id 00000000-0000-4000-8000-0000000000e2
          --objective "E2E run left behind by a dead process"

      - name: Generate a fresh secrets-encryption key for this run
        working-directory: backend
        run: |
          echo "SECRETS_ENCRYPTION_KEY=$(.venv/bin/python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"

      - name: Start backend (port 8000)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://tradingos:tradingos@localhost:5432/tradingos
          JWT_SECRET_KEY: dev-only-secret-do-not-use-in-production
          CORS_ORIGINS: http://localhost:3010
          AGENT_GATEWAY_CONFIG_PATH: ../config/tradingos.config.json
          NSE_HOLIDAYS_PATH: ../config/nse_holidays.json
          SECRETS_STORE_PATH: secrets/e2e_broker_credentials.enc
          # The suite drives a Next dev server that polls dozens of
          # endpoints per page, all from one IP (127.0.0.1) -- measured at
          # ~300 requests/minute, exactly the blanket API limiter's default
          # ceiling (settings.api_rate_limit_per_minute). Once it trips, a
          # 429 on the page's session check bounces the browser to /login
          # and every later spec fails. tests/conftest.py disables the same
          # limiter for the pytest suite for the same reason.
          API_RATE_LIMIT_PER_MINUTE: 100000
        run: |
          mkdir -p secrets
          nohup .venv/bin/python -m uvicorn src.main:app --host 0.0.0.0 --port 8000 > /tmp/backend.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 1
          done
          echo "backend never became healthy"; cat /tmp/backend.log; exit 1

      - name: Start frontend (port 3010)
        env:
          PORT: 3010
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: |
          nohup pnpm dev > /tmp/frontend.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://localhost:3010 && exit 0
            sleep 1
          done
          echo "frontend never became healthy"; cat /tmp/frontend.log; exit 1

      - name: Resolve the installed Chromium path for playwright.config.ts
        run: |
          echo "PLAYWRIGHT_CHROMIUM_PATH=$(node -e "console.log(require('playwright-core').chromium.executablePath())")" >> "$GITHUB_ENV"

      - name: Playwright E2E
        env:
          E2E_BASE_URL: http://localhost:3010
        run: pnpm exec playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            /tmp/backend.log
            /tmp/frontend.log
          retention-days: 7

  frontend:
    name: Frontend (tsc)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # next.config.mjs sets typescript.ignoreBuildErrors: true (so `next
      # build` never catches a type error) -- this is the actual type
      # check, run the same way it was verified in Phase 17's local pass:
      # against a real node_modules, not `next build`'s own pass.
      - name: tsc --noEmit
        run: pnpm exec tsc --noEmit -p .

  # Docker images (docs/phase20-old-vs-new-comparison.md item 30). Every run
  # builds both images, so a broken Dockerfile fails here rather than the next
  # time someone runs `docker compose build` -- nothing in CI built them
  # before. Only a push to main (or a `v*` tag) that has passed every job
  # above publishes them to GHCR; pull requests build and discard.
  #
  # Published: the backend image (Postgres + API, host-agnostic) and the
  # all-in-one image (frontend + backend + Postgres + Redis + nginx behind
  # one port; Dockerfile.allinone bakes an EMPTY NEXT_PUBLIC_API_URL on
  # purpose so the same image works on any host). NOT published: the root
  # frontend-only image -- it inlines NEXT_PUBLIC_API_URL at build time
  # (default http://localhost:8000), so a registry copy would only ever work
  # for someone running the backend on localhost:8000; build that one locally
  # (`docker compose build frontend`) with the URL you actually need.
  images:
    name: Docker image (${{ matrix.image.name }})
    needs: [secrets-scan, backend, e2e, frontend]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: backend
            context: ./backend
            file: ./backend/Dockerfile
          - name: allinone
            context: .
            file: ./Dockerfile.allinone

    steps:
      - uses: actions/checkout@v5

      # GHCR image names must be lowercase; the repo name is not.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.image.name }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # sha-<short> for every published build, `latest` only from the default
      # branch, and <version> / <major.minor> for a `v*` tag.
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build${{ github.event_name == 'push' && ' and push' || '' }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
